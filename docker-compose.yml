services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: digitalbanking-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_strong_password123"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Your_strong_password123" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: digitalbanking-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=DigitalBankingSimpleDb;User Id=sa;Password=Your_strong_password123;TrustServerCertificate=True;"
    ports:
      - "5267:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:5267/api
    container_name: digitalbanking-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  sqlserver-data:
